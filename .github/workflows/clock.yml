name: Clock WIB Aesthetic
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update Aesthetic Clock Badge
        run: |
          TIME_NOW=$(TZ='Asia/Pontianak' date '+%H:%M:%S')
          DATE_NOW=$(TZ='Asia/Pontianak' date '+%Y-%m-%d')
          # ganti badge jam jadi estetik for-the-badge ungu
          sed -i "s|badge/🕒_.*_WIB|badge/🕒_${TIME_NOW}_WIB|g" README.md
      - name: Commit
        run: |
          git config user.name "Mr.Tamaaa Bot"
          git config user.email "bot@tamayana"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "⏰ $TIME_NOW WIB"
          git push
