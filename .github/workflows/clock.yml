name: Clock WIB Aesthetic
on:
  schedule:
    - cron: '*/2 * * * *' # tiap 2 menit (biar gak kena limit GitHub)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update Clock
        run: |
          TIME_NOW=$(TZ='Asia/Pontianak' date '+%H:%M WIB')
          DATE_NOW=$(TZ='Asia/Pontianak' date '+%Y-%m-%d')
          # format buat shields: 11:43_WIB -> 11%3A43_WIB
          TIME_BADGE=$(echo $TIME_NOW | sed 's/:/%3A/g' | sed 's/ /_/g')
          sed -i "s|badge/🕒_.*_WIB|badge/🕒_${TIME_BADGE}|g" README.md
      - name: Commit
        run: |
          git config user.name "Mr.Tamaaa Bot"
          git config user.email "bot@tamayana"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "⏰ $TIME_NOW"
          git push
